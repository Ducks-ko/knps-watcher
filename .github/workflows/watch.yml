yaml
name: KNPS 생태탐방원 잔여 알림

on:
  schedule:
    # 10분마다 실행 (UTC 기준이라 한국시간과 다르지만 신경 안 써도 됩니다)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # "Run workflow" 버튼으로 수동 실행도 가능하게 함

# state.json 파일을 다시 저장소에 커밋할 수 있도록 쓰기 권한 부여
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 잔여 확인 스크립트 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py

      - name: 상태 파일(state.json) 변경사항 저장소에 커밋
        run: |
          git config user.name "knps-watcher-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update state"
          git push
